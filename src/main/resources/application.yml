spring:
  application:
    name: spaceflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spaceflow}
    username: ${DB_USER:spaceflow}
    password: ${DB_PASSWORD:spaceflow}

  jpa:
    hibernate:
      ddl-auto: validate          # schema owned by Flyway, never auto-generated
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: spaceflow
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          # local issuer; swap for Google/GitHub or your own auth server
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/spaceflow}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: spaceflow

springdoc:
  swagger-ui:
    path: /swagger-ui

spaceflow:
  outbox:
    poll-interval-ms: 2000

logging:
  level:
    com.spaceflow: INFO
    org.springframework.kafka: WARN
